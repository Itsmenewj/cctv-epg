
name: Update CCTV EPG - FIXED

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cctv-epg-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate EPG
        run: python generate_epg.py

      - name: Save updated EPG and joke cache
        run: |
          set -e

          git config user.name "CCTV EPG Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cctv-epg.xml joke_cache.json

          if git diff --cached --quiet; then
            echo "EPG and joke cache have no changes to commit."
            exit 0
          fi

          git commit -m "Update rolling CCTV EPG and joke cache"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt of 3"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "EPG and joke cache successfully updated."
              exit 0
            fi

            echo "Push rejected; retrying."
          done
          echo "Failed to push after 3 attempts."
          exit 1
```
